<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LightMode" />
    <meta name="theme-color" content="#0B0F1A" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Generation LightMode</title>
    <meta name="description" content="Generation LightMode — Faith. Always On." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Generation LightMode" />
    <meta property="og:description" content="Faith. Always On." />
    <meta property="og:image" content="https://media.base44.com/images/public/69a6fca6155ae283f1b55144/2e403078b_LOGO-LANDSCAPE-GOLD_WEB.png" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Generation LightMode" />
    <meta name="twitter:description" content="Faith. Always On." />
    <meta name="twitter:image" content="https://media.base44.com/images/public/69a6fca6155ae283f1b55144/2e403078b_LOGO-LANDSCAPE-GOLD_WEB.png" />
  </head>
  <body>
    <div id="root">
      <!-- Static instant-paint splash, shown before JS loads. React overwrites this on mount;
           keep this markup visually identical to src/components/SplashScreen.jsx. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0B0F1A;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;width:10rem;height:10rem;border-radius:9999px;filter:blur(24px);background:radial-gradient(circle,rgba(255,208,0,0.35),transparent 70%);animation:splashPulse 2s ease-in-out infinite;"></div>
          <img src="/icons/icon-192.png" alt="" style="position:relative;width:5rem;height:5rem;border-radius:1rem;box-shadow:0 0 40px rgba(255,208,0,0.25);animation:splashBreathe 2.4s ease-in-out infinite;" />
        </div>
        <div style="margin-top:1.5rem;color:#fff;font-weight:800;font-size:1.25rem;letter-spacing:-0.01em;font-family:'Space Grotesk',sans-serif;">Generation LightMode</div>
        <div style="margin-top:0.375rem;color:#FFD000;font-weight:600;font-size:0.875rem;letter-spacing:0.02em;">Faith. Always On.</div>
      </div>
      <style>
        @keyframes splashPulse { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
        @keyframes splashBreathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
