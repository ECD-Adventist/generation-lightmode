    <!-- Content-Security-Policy. Delivered via meta because Base44 hosting owns the HTTP
         response headers. Note: frame-ancestors is ignored in meta form — clickjacking is
         already covered by the server's X-Frame-Options: DENY header (verified live).
         'unsafe-inline' in script-src is required by the Vite dev/React Refresh bootstrap
         and platform-injected inline module scripts in the builder preview; no dependency
         requires 'unsafe-eval' (production bundle verified free of eval/new Function). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' blob:;
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               img-src 'self' data: blob: https:;
               font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
               media-src 'self' data: blob: https:;
               connect-src 'self' https://*.supabase.co https://*.base44.com https://*.base44.app https://fonts.googleapis.com https://fonts.gstatic.com https://*.ingest.sentry.io https://flagcdn.com https://images.unsplash.com;
               worker-src 'self' blob:;
               frame-src 'self' https://www.youtube.com;
               frame-ancestors 'none';
               base-uri 'self';
               form-action 'self';
               object-src 'none';
               upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.json" />
    <title>LightMode</title>
    <meta name="description" content="Generation LightMode — Faith. Always On." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Generation LightMode" />

    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Generation LightMode" />
    <meta name="twitter:description" content="Faith. Always On." />

  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0B0F1A;">
        <img src="https://media.base44.com/images/public/69a6fca6155ae283f1b55144/2e403078b_LOGO-LANDSCAPE-GOLD_WEB.png" alt="Generation LightMode" style="width:auto;max-width:280px;height:auto;" onerror="this.style.display='none';" />
      </div>
      <style>@keyframes splashSpin { to { transform:rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      if ("serviceWorker" in navigator) {
        if (import.meta.env.DEV) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
        } else {
          window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js").catch(() => {});
          });
        }
      }
    </script>
  </body>
</html>
